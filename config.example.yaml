# User preferences and run policy.
# Keep secrets out of this file.

profile:
  name: default
  timezone: Asia/Shanghai
  output_dir: output
  cache_dir: cache
  state_dir: state

focus:
  chains: []
  sectors: []
  geographies:
    - global

risk:
  profile: balanced
  min_confidence: 0.6
  min_opportunity_score: 72
  strong_candidate_score: 80
  tier1_score: 84

memory:
  dedupe_window_days: 21
  novelty_window_days: 14
  max_watchlist_size: 150

run:
  mode: resume
  skip_unavailable_sources: true
  fail_on_schema_error: false
  max_projects_per_run: 50
  save_compact_context: true

filters:
  active_profile: opportunity
  profiles:
    opportunity:
      min_confidence: 0.55
      include_any_tags: []
      exclude_title_keywords:
        - ETF
        - CEX
        - 币安
        - 欧易
        - OKX
        - Coinbase
        - 美股
        - 韩股
        - 盘前
        - 净流入
      exclude_summary_keywords:
        - ETF
        - 现货ETF
        - CEX
        - 已上线币安
        - listed on Binance
        - listed on Coinbase
        - 美股
        - 韩股
        - 盘前
        - 净流入
      exclude_established_projects: true
      require_any_signal:
        - participation
        - funding
        - builder
        - early_stage
    market:
      min_confidence: 0.0
      include_any_tags: []
      exclude_title_keywords: []
      exclude_summary_keywords: []

reporting:
  locale: auto
  primary_format: html
  generate_formats:
    - html
    - md
  include_rejected_candidates: false
  include_source_trace: true
  include_score_breakdown: true
