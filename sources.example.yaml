sources:
  official:
    - id: official_blog_rss
      enabled: true
      type: rss
      category: official
      label: Official project blogs
      cadence: daily
      notes: Use for launch posts, release notes, partnership announcements, and product milestones.

  social:
    - id: curated_twitter_list
      enabled: true
      adapter: opentwitter
      type: api
      category: social
      label: Curated builder and researcher list
      cadence: daily
      notes: Requires OPENTWITTER_API_KEY. Prefer accounts that post build progress, launch threads, and ecosystem discoveries.
      auth:
        kind: bearer
        env: OPENTWITTER_API_KEY
        header: Authorization
      request:
        base_url: https://api.opentwitter.example
        path: /v1/search
        method: GET
        headers:
          Accept: application/json
        query:
          q: "testnet OR waitlist OR points OR grant web3"
          limit: 20

  discovery:
    - id: rootdata_funding_rounds
      enabled: true
      adapter: rootdata
      type: api
      category: discovery
      label: RootData recent funding rounds
      cadence: daily
      notes: Requires ROOTDATA_API_KEY. Primary early-stage source; scans recent financing records before hot_index.
      auth:
        kind: bearer
        env: ROOTDATA_API_KEY
        header: Authorization
      request:
        base_url: https://api.rootdata.com
        path: /open/skill/get_fac
        method: POST
        headers:
          Accept: application/json
          language: en
          Content-Type: application/json
        body:
          start_time_relative_days: 14
          limit: 50
    - id: rootdata_projects
      enabled: true
      adapter: rootdata
      type: api
      category: discovery
      label: RootData hot projects
      cadence: daily
      notes: Requires ROOTDATA_API_KEY. Hot index is attention-biased and should be used as enrichment, not the primary early-stage source.
      auth:
        kind: bearer
        env: ROOTDATA_API_KEY
        header: Authorization
      request:
        base_url: https://api.rootdata.com
        path: /open/skill/hot_index
        method: POST
        headers:
          Accept: application/json
          language: en
        body:
          days: 1
      detail_request:
        base_url: https://api.rootdata.com
        path: /open/skill/get_item
        method: POST
        headers:
          Accept: application/json
          language: en
          Content-Type: application/json
        body:
          include_team: true
          include_investors: true
    - id: opennews_projects
      enabled: true
      adapter: opennews
      type: api
      category: discovery
      label: OpenNews project discovery
      cadence: daily
      notes: Requires OPENNEWS_API_KEY. Used for launch, funding, ecosystem, and early-access news when adapter is installed.
      auth:
        kind: bearer
        env: OPENNEWS_API_KEY
        header: Authorization
      request:
        base_url: https://api.opennews.example
        path: /v1/search
        method: GET
        headers:
          Accept: application/json
        query:
          q: "web3 funding OR testnet OR waitlist OR points"
          limit: 20
    - id: blockbeats_financing_newsflash
      enabled: true
      adapter: blockbeats
      type: api
      category: discovery
      label: BlockBeats financing newsflash
      cadence: hourly
      notes: Requires BLOCKBEATS_API_KEY. Prefer this over original-only newsflash for early funding discovery.
      auth:
        kind: header
        env: BLOCKBEATS_API_KEY
        header: api-key
      request:
        base_url: https://api-pro.theblockbeats.info
        path: /v1/newsflash/financing
        method: GET
        headers:
          Accept: application/json
        query:
          page: 1
          size: 20
          lang: cn
    - id: blockbeats_onchain_newsflash
      enabled: true
      adapter: blockbeats
      type: api
      category: discovery
      label: BlockBeats on-chain newsflash
      cadence: hourly
      notes: Requires BLOCKBEATS_API_KEY. Captures on-chain launches, incentives, and protocol activity.
      auth:
        kind: header
        env: BLOCKBEATS_API_KEY
        header: api-key
      request:
        base_url: https://api-pro.theblockbeats.info
        path: /v1/newsflash/onchain
        method: GET
        headers:
          Accept: application/json
        query:
          page: 1
          size: 20
          lang: cn
    - id: blockbeats_important_newsflash
      enabled: true
      adapter: blockbeats
      type: api
      category: discovery
      label: BlockBeats important newsflash
      cadence: hourly
      notes: Requires BLOCKBEATS_API_KEY. Captures important market/project signals beyond financing.
      auth:
        kind: header
        env: BLOCKBEATS_API_KEY
        header: api-key
      request:
        base_url: https://api-pro.theblockbeats.info
        path: /v1/newsflash/important
        method: GET
        headers:
          Accept: application/json
        query:
          page: 1
          size: 20
          lang: cn
    - id: blockbeats_ai_newsflash
      enabled: true
      adapter: blockbeats
      type: api
      category: discovery
      label: BlockBeats AI newsflash
      cadence: hourly
      notes: Requires BLOCKBEATS_API_KEY. Captures AI x crypto launch and funding signals.
      auth:
        kind: header
        env: BLOCKBEATS_API_KEY
        header: api-key
      request:
        base_url: https://api-pro.theblockbeats.info
        path: /v1/newsflash/ai
        method: GET
        headers:
          Accept: application/json
        query:
          page: 1
          size: 20
          lang: cn
    - id: blockbeats_first_newsflash
      enabled: true
      adapter: blockbeats
      type: api
      category: discovery
      label: BlockBeats first newsflash
      cadence: hourly
      notes: Requires BLOCKBEATS_API_KEY. Captures first/launch-stage signals for early participation.
      auth:
        kind: header
        env: BLOCKBEATS_API_KEY
        header: api-key
      request:
        base_url: https://api-pro.theblockbeats.info
        path: /v1/newsflash/first
        method: GET
        headers:
          Accept: application/json
        query:
          page: 1
          size: 20
          lang: cn
    - id: blockbeats_original_newsflash
      enabled: false
      adapter: blockbeats
      type: api
      category: discovery
      label: BlockBeats original newsflash
      cadence: hourly
      notes: Requires BLOCKBEATS_API_KEY. Uses BlockBeats original newsflash as a fast-moving discovery surface.
      filter_profiles:
        opportunity:
          exclude_title_keywords:
            - ETF
            - 美股
            - 韩股
            - 盘前
            - 期权
            - 净流入
          exclude_summary_keywords:
            - 美股
            - 韩股
            - ETF
            - 盘前
      auth:
        kind: header
        env: BLOCKBEATS_API_KEY
        header: api-key
      request:
        base_url: https://api-pro.theblockbeats.info
        path: /v1/newsflash/original
        method: GET
        headers:
          Accept: application/json
        query:
          page: 1
          size: 10
          lang: cn
    - id: github_trending_builders
      enabled: true
      adapter: github
      type: api
      category: discovery
      label: GitHub repos and contributors
      cadence: daily
      notes: Useful for spotting active repos, fast star growth, and shipping velocity.
      auth:
        kind: bearer_optional
        env: GITHUB_TOKEN
        header: Authorization
      request:
        base_url: https://api.github.com
        path: /search/repositories
        method: GET
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
          User-Agent: web3-opportunity-scout
        queries:
          - web3
          - crypto
          - defi
        query:
          sort: updated
          order: desc
          per_page: 10
          page: 1
    - id: defillama_new_protocols
      enabled: true
      adapter: defillama
      type: api
      category: discovery
      label: DeFiLlama listings
      cadence: daily
      notes: Good for emerging protocols and category tagging.
      request:
        base_url: https://api.llama.fi
        path: /protocols
        method: GET
        headers:
          Accept: application/json
        query:
          limit: 20
    - id: surf_project_ai_news
      enabled: true
      adapter: surf
      type: api
      category: discovery
      label: Surf project AI news
      cadence: daily
      notes: Requires SURF_API_KEY. Premium enrichment source; keep max_queries_per_run low because each query consumes credits.
      auth:
        kind: bearer
        env: SURF_API_KEY
        header: Authorization
      request:
        base_url: https://api.asksurf.ai
        path: /gateway/v1/project/ai-news
        method: GET
        headers:
          Accept: application/json
        queries:
          - ethereum
          - solana
        query:
          limit: 5
          offset: 0
          lang: en
          max_queries_per_run: 2

  builder:
    - id: hackathon_results
      enabled: true
      type: webpage
      category: builder
      label: Hackathons and demo days
      cadence: weekly
      notes: Good source for early teams before broad market awareness.

  market:
    - id: crypto_fundraising_recent
      enabled: true
      adapter: crypto-fundraising
      type: webpage
      category: market
      label: Crypto Fundraising recent deals
      cadence: daily
      notes: Public recent fundraising table used as a no-key funding signal source.
      request:
        base_url: https://crypto-fundraising.info
        path: /
        method: GET
        headers:
          Accept: text/html
          User-Agent: web3-opportunity-scout
    - id: funding_signals
      enabled: true
      type: api
      category: market
      label: Funding and investor signal feeds
      cadence: daily
      notes: Funding alone is not enough; combine with shipping or builder evidence.
